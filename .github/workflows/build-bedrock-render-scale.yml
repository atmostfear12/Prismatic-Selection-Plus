name: Build BedrockRenderScale

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Build mode"
        required: true
        default: "probe"
        type: choice
        options:
          - probe
          - scale
      scale:
        description: "Scale mode only (0.50 = half width and height)"
        required: true
        default: "0.50"

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout tweak branch
        uses: actions/checkout@v4
        with:
          ref: bedrock-render-scale

      - name: Build unsigned arm64 iOS dylib
        shell: bash
        run: |
          set -euxo pipefail
          MODE="${{ github.event.inputs.mode }}"
          SCALE="${{ github.event.inputs.scale }}"
          SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          mkdir -p build

          if [[ "$MODE" == "probe" ]]; then
            SOURCE="bedrock-render-scale/Probe.m"
            OUTPUT="build/BedrockRenderProbe.dylib"
            INSTALL_NAME="/Library/MobileSubstrate/DynamicLibraries/BedrockRenderProbe.dylib"
          else
            SOURCE="bedrock-render-scale/Tweak.m"
            OUTPUT="build/BedrockRenderScale.dylib"
            INSTALL_NAME="/Library/MobileSubstrate/DynamicLibraries/BedrockRenderScale.dylib"
          fi

          xcrun --sdk iphoneos clang \
            -arch arm64 \
            -dynamiclib \
            -fobjc-arc \
            -O2 \
            -miphoneos-version-min=14.0 \
            -isysroot "$SDK" \
            -DBEDROCK_RENDER_SCALE="$SCALE" \
            -framework Foundation \
            -framework QuartzCore \
            -framework Metal \
            -framework UIKit \
            -install_name "$INSTALL_NAME" \
            "$SOURCE" \
            -o "$OUTPUT"

          echo "=== mode ==="
          echo "$MODE"
          echo "=== file ==="
          file "$OUTPUT"
          echo "=== linked libraries ==="
          otool -L "$OUTPUT"
          echo "=== load commands ==="
          otool -l "$OUTPUT" | egrep -A6 'LC_ID_DYLIB|LC_BUILD_VERSION|LC_VERSION_MIN_IPHONEOS|LC_CODE_SIGNATURE' || true

          echo "=== signature check (expected unsigned) ==="
          codesign -dv "$OUTPUT" && exit 1 || true

          if [[ "$MODE" == "probe" ]]; then
            echo "ARTIFACT_NAME=BedrockRenderProbe-unsigned" >> "$GITHUB_ENV"
            echo "ARTIFACT_PATH=$OUTPUT" >> "$GITHUB_ENV"
          else
            echo "ARTIFACT_NAME=BedrockRenderScale-${SCALE}-unsigned" >> "$GITHUB_ENV"
            echo "ARTIFACT_PATH=$OUTPUT" >> "$GITHUB_ENV"
          fi

      - name: Upload unsigned dylib
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: ${{ env.ARTIFACT_PATH }}
          if-no-files-found: error
