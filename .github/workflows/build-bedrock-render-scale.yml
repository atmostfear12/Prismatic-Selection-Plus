name: Build BedrockRenderScale

on:
  workflow_dispatch:
    inputs:
      scale:
        description: "Ignored by diagnostic build; keep 0.50"
        required: true
        default: "0.50"

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout tweak branch
        uses: actions/checkout@v4
        with:
          ref: bedrock-render-scale

      - name: Build unsigned Hynis-style arm64 iOS diagnostic dylib
        shell: bash
        run: |
          set -euxo pipefail
          SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          mkdir -p build

          xcrun --sdk iphoneos clang \
            -arch arm64 \
            -dynamiclib \
            -O2 \
            -miphoneos-version-min=14.0 \
            -isysroot "$SDK" \
            -install_name "/Library/MobileSubstrate/DynamicLibraries/BedrockRenderScale.dylib" \
            bedrock-render-scale/Diagnostic.c \
            -o build/BedrockRenderScale.dylib

          echo "=== file ==="
          file build/BedrockRenderScale.dylib
          echo "=== linked libraries ==="
          otool -L build/BedrockRenderScale.dylib
          echo "=== load commands ==="
          otool -l build/BedrockRenderScale.dylib | egrep -A6 'LC_ID_DYLIB|LC_BUILD_VERSION|LC_VERSION_MIN_IPHONEOS|LC_CODE_SIGNATURE' || true

          echo "=== signature check (expected unsigned) ==="
          codesign -dv build/BedrockRenderScale.dylib && exit 1 || true

      - name: Upload unsigned dylib
        uses: actions/upload-artifact@v4
        with:
          name: BedrockRenderScale-unsigned-diagnostic
          path: build/BedrockRenderScale.dylib
          if-no-files-found: error
